# Autorizado por la dueña/dueño del repositorio: lee en misal.mx SOLO las citas de las lecturas del día
# (misal.mx permite visitas automáticas en su robots.txt) y las guarda en biblia-app/evangelio.json.
# Si misal.mx no ha publicado el día, usa Vatican News (mismo Leccionario mexicano) hasta que misal.mx lo publique.
# Corre unas pocas veces al día (horas en UTC; México = UTC-6). Si la cita cambió, la sube y se publica la app.
name: Evangelio del día
on:
  schedule:
    - cron: '23 * * * *'       # cada hora (GitHub a veces se salta corridas; así no se queda sin actualizar)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: evangelio
  cancel-in-progress: false
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Leer la cita del Evangelio de hoy en misal.mx
        run: python3 herramientas/evangelio/obtener.py
      - name: Guardar si cambió
        run: |
          if git diff --quiet -- biblia-app/evangelio.json; then echo "Sin cambios"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898319+github-actions[bot]@users.noreply.github.com"
          git add biblia-app/evangelio.json
          git commit -m "Evangelio del día: $(date -u +%F)"
          git push
