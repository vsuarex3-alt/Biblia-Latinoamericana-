# Publica la carpeta biblia-app en GitHub Pages cada vez que se sube un cambio a main
name: Publicar en GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  # cuando «Evangelio del día» sube una cita nueva, se vuelve a publicar la app
  workflow_run:
    workflows: ["Evangelio del día"]
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  preparar:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: biblia-app
  publicar:
    needs: preparar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
