<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Biblia Latinoamericana</title>
<meta name="description" content="La Biblia Latinoamericana: buscador de citas y lectura, también sin internet.">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f3a2c">
<link rel="icon" type="image/png" sizes="32x32" href="iconos/favicon-32.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Biblia">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" sizes="180x180" href="iconos/apple-touch-icon.png">
<link rel="preload" href="fuentes/literata-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fuentes/cormorant-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/estilos.css">
<script>try{var t=localStorage.getItem('blat-tema');if(t)document.documentElement.dataset.theme=JSON.parse(t);}catch(e){}</script>
</head>
<body>

<header class="band" id="band">
  <div class="band-in gut">
    <div class="brand">
      <div>
        <h1>La Biblia <em>Latinoamérica</em></h1>
        <div class="sub">Buscador de citas</div>
      </div>
      <div class="brand-r"><div class="stat" id="statusText"></div><button class="temabtn" id="tema" type="button" aria-label="Cambiar entre modo claro y oscuro"><svg class="luna" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg><svg class="sol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg></button></div>
    </div>
    <div class="searchbox">
      <form class="search" id="searchForm" role="search" autocomplete="off">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
        <input id="q" type="search" enterkeyhint="search" autocapitalize="sentences" autocorrect="off" spellcheck="false" placeholder="Juan 6,8-14 · Sal 23 · una palabra" aria-label="Buscar cita o palabra">
        <button class="iconbtn" id="clearQ" type="button" aria-label="Borrar" hidden><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        <button class="iconbtn mic" id="mic" type="button" aria-label="Dictar cita" hidden><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
        <button class="go" type="submit">Buscar</button>
      </form>
      <div class="suggest" id="suggest" hidden role="listbox"></div>
    </div>
    <div class="live" id="live" aria-live="polite"></div>
    <div class="chips" id="chips">
      <button class="chip" type="button">Jn 3,16</button>
      <button class="chip" type="button">Sal 23</button>
      <button class="chip" type="button">Juan seis ocho al catorce</button>
      <button class="chip" type="button">1 Co 13,4-7</button>
      <button class="chip" type="button">Mt 5,1-12</button>
      <button class="chip" type="button">"no temas"</button>
    </div>
  </div>
</header>

<div class="shell gut">
  <aside class="side" id="side" aria-label="Libros"></aside>
  <main id="main"></main>
</div>

<nav class="tabbar" role="tablist" aria-label="Secciones">
  <button role="tab" id="tabEvg" aria-selected="false" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M7 8h10"/><path d="M5 21h14"/></svg>Evangelio</button>
  <button role="tab" id="tabSearch" aria-selected="true" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>Buscar</button>
  <button role="tab" id="tabBooks" aria-selected="false" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M4 5.5v16M9 7h7"/></svg>Libros</button>
  <button role="tab" id="tabHist" aria-selected="false" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg>Historial</button>
  <button role="tab" id="tabRead" aria-selected="false" type="button" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5h6a4 4 0 0 1 4 4v11a3 3 0 0 0-3-3H2zM22 5h-6a4 4 0 0 0-4 4v11a3 3 0 0 1 3-3h7z"/></svg>Leer</button>
</nav>

<div class="selbar" id="selbar" hidden>
  <span id="selCount">1 versículo</span>
  <button class="copy" id="selCopy" type="button">Copiar</button>
  <button class="clear" id="selClear" type="button">Quitar</button>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="xfile" accept=".zip,.txt,application/zip,text/plain" hidden>

<aside class="instalar" id="instalar" hidden>
  <img src="iconos/icon-192.png" alt="">
  <div class="txt" id="instalarTxt"></div>
  <button class="go2" id="instalarBtn" type="button" hidden>Instalar</button>
  <button class="cerrar" id="instalarCerrar" type="button" aria-label="Cerrar aviso"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
</aside>

<script src="js/vendor/jszip.min.js" defer></script>
<script src="js/datos-biblia.js"></script>
<script src="js/libros.js"></script>
<script src="js/app.js"></script>
<script src="js/pwa.js"></script>
</body>
</html>
